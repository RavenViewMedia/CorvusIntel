name: Corvus Collector

on:
  workflow_dispatch:

jobs:
  collector:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Repository
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Repository contents:"
          ls -R

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Collector
        run: node collector/collector.js
