name: Corvus Collector

on:
  workflow_dispatch:

jobs:
  collector:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Collector
        run: node collector/collector.js