name: Corvus Collector

on:
  workflow_dispatch:

jobs:
  collector:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Collector
        run: node collector/collector.js

      - name: Commit updated stories
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add CorvusIntel/data/stories.json

          git diff --cached --quiet || git commit -m "Update stories"

          git push