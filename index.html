<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corvus</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>CORVUS</h1>
    <p>Open Source Intelligence Operations Center</p>
</header>

<main>

  <main>

    <section class="panel">
        <h2>🔴 Raven Alerts</h2>
        <p>No active alerts.</p>
    </section>

    <section class="panel">
        <h2>🟠 High Priority</h2>
    </section>

    <section class="panel">
        <h2>🟢 World Watch</h2>
        <p>No stories loaded.</p>
    </section>

    <section class="panel">
        <h2>📊 Intelligence Overview</h2>

        <div class="stats">

            <div class="stat-card">
                <h3>0</h3>
                <p>Raven Alerts</p>
            </div>

            <div class="stat-card">
                <h3>2</h3>
                <h3 id="storyCount">0</h3>
<p>Stories Loaded</p>
            </div>

            <div class="stat-card">
                <h3>2</h3>
                <h3 id="sourceCount">0</h3>
<p>Sources</p>
            </div>

        </div>

    </section>

</main>

<script src="app.js"></script>

</main>

<script src="app.js"></script>

</body>
</html>
